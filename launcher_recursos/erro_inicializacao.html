<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema de Relatório de Devoluções</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#1e1b29; font-family:'Segoe UI',sans-serif; padding:24px; box-sizing:border-box; }
  .caixa { text-align:center; color:white; max-width:520px; }
  .titulo { font-size:20px; font-weight:bold; margin-bottom:8px; color:#f0a0a0; }
  .subtitulo { font-size:13px; color:#b8a9f0; margin-bottom:20px; }
  .instrucao { font-size:14px; color:white; margin-bottom:16px; line-height:1.5; }
  .detalhe { font-size:12px; color:#8a7fb0; background:#2a2540; padding:12px; border-radius:6px;
             text-align:left; word-break:break-word; font-family:Consolas,monospace; }
</style>
</head>
<body>
  <div class="caixa">
    <div class="titulo">Não foi possível iniciar o sistema</div>
    <div class="subtitulo">Sistema de Relatório de Devoluções</div>
    <div class="instrucao">Verifique se o MySQL está rodando nesta máquina e tente abrir o sistema de novo. Se o problema continuar, avise o Matheus com a mensagem abaixo.</div>
    <div class="detalhe" id="detalhe"></div>
  </div>
  <script>
    const detalhe = __DETALHE__;
    document.getElementById("detalhe").textContent = detalhe;
  </script>
</body>
</html>
