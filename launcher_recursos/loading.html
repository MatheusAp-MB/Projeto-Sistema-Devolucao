<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema de Relatório de Devoluções</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#1e1b29; font-family:'Segoe UI',sans-serif; padding:24px; box-sizing:border-box; }
  .caixa { text-align:left; color:white; max-width:700px; }
  .titulo { font-size:20px; font-weight:bold; margin-bottom:8px; text-align:center; }
  .subtitulo { font-size:13px; color:#b8a9f0; margin-bottom:20px; text-align:center; }
  .debug { font-size:13px; color:#d8d0f5; line-height:1.8; background:#12101c;
           padding:16px; border-radius:8px; white-space:pre-wrap; word-break:break-all; }
  .continuar { margin-top:16px; text-align:center; }
  .continuar a { color:#b8a9f0; font-size:14px; }
</style>
</head>
<body>
  <div class="caixa">
    <div class="titulo">Diagnóstico</div>
    <div class="subtitulo">Sistema de Relatório de Devoluções</div>
    <div class="debug" id="debug"></div>
    <div class="continuar"><a href="#" id="link">Clique aqui pra continuar →</a></div>
  </div>
  <script>
    const dados = __DADOS_JSON__;
    const urlDestino = dados.url || "http://127.0.0.1:8000/";
    const linhas = Object.entries(dados).map(([chave, valor]) => chave + " = " + valor);
    document.getElementById("debug").textContent = linhas.join("\n");
    document.getElementById("link").href = urlDestino;
  </script>
</body>
</html>
