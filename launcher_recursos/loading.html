<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema de Relatório de Devoluções</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         background:#1e1b29; font-family:'Segoe UI',sans-serif; }
  .caixa { text-align:center; color:white; }
  .titulo { font-size:20px; font-weight:bold; margin-bottom:8px; }
  .subtitulo { font-size:13px; color:#b8a9f0; }
</style>
</head>
<body>
  <div class="caixa">
    <div class="titulo">Iniciando o sistema...</div>
    <div class="subtitulo">Sistema de Relatório de Devoluções</div>
  </div>
  <script>
    // O navegador bloqueia fetch() de uma página file:// pra um IP de
    // rede local (192.168.x.x) — proteção de segurança contra página
    // local "sondando" a rede. Por isso a checagem (fetch) é sempre no
    // localhost (que funciona normalmente); só depois de confirmar que
    // o servidor subiu, navega de verdade (não é mais fetch, é troca
    // de página mesmo) pro endereço real — seja ele o de rede (celular)
    // ou o próprio localhost, se IPV4_LOCAL não estiver configurado.
    const parametros = new URLSearchParams(window.location.search);
    const urlDestino = parametros.get("url") || "http://127.0.0.1:8000/";
    const urlChecagem = parametros.get("fallback") || "http://127.0.0.1:8000/";

    function tentarConectar() {
      fetch(urlChecagem, { mode: "no-cors" })
        .then(() => { window.location.href = urlDestino; })
        .catch(() => { setTimeout(tentarConectar, 300); });
    }
    setTimeout(tentarConectar, 300);
  </script>
</body>
</html>
