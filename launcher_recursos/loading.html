<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Sistema de Relatório de Devoluções</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
         background:#1e1b29; font-family:'Segoe UI',sans-serif; }
  .caixa { text-align:center; color:white; }
  .titulo { font-size:20px; font-weight:bold; margin-bottom:8px; }
  .subtitulo { font-size:13px; color:#b8a9f0; }
  .debug { font-size:12px; color:#7a6fa8; margin-top:16px; }
</style>
</head>
<body>
  <div class="caixa">
    <div class="titulo">Iniciando o sistema...</div>
    <div class="subtitulo">Sistema de Relatório de Devoluções</div>
    <div class="debug" id="debug"></div>
  </div>
  <script>
    // Mostra na tela o endereço que o launcher.py calculou (via query
    // string) ANTES de tentar abrir — serve pra diagnosticar se o
    // problema é o valor calculado (IPV4_LOCAL não lido certo) ou algo
    // depois disso (redirecionamento).
    const parametros = new URLSearchParams(window.location.search);
    const urlDestino = parametros.get("url") || "http://127.0.0.1:8000/";
    document.getElementById("debug").textContent = "Abrindo em: " + urlDestino;
    setTimeout(() => { window.location.href = urlDestino; }, 2000);
  </script>
</body>
</html>
