{% load static %}
{# data-busca: nome + marca + código do fabricante + nomes dos produtos a que a peça está vinculada (a busca da tela acha por qualquer um). data-produtos: "|id|id|" dos produtos vinculados, pro filtro "Produto". #}
<label class="vp-card{% if peca.ja_vinculada %} ja-vinculada{% endif %}" data-item
       data-peca-id="{{ peca.id }}"
       data-busca="{{ peca.nome_generico|lower }} {{ peca.marca.nome|lower }} {{ peca.codigo_fabricante|default:''|lower }} {{ peca.nomes_produtos_busca|lower }}"
       data-produtos="{{ peca.produtos_ids_texto }}"
       data-marca-id="{{ peca.marca_id }}">
    <input type="checkbox" name="peca_id" value="{{ peca.id }}" class="vp-card-checkbox-real"
           {% if peca.ja_vinculada %}checked{% endif %}>
    <span class="vp-card-checkbox-visual" aria-hidden="true"><i class="fas fa-check"></i></span>
    {% if peca.ja_vinculada %}<span class="vp-card-ja-vinculada">Já vinculada</span>{% endif %}

    {# Foto abre ampliada no modal de fotos do sistema (classe card-fotos-item); o clique na foto NÃO marca a peça — o modal cancela o clique do <label>. #}
    <div class="vp-card-foto{% if peca.imagem %} card-fotos-item{% endif %}"
         {% if peca.imagem %}data-fotos-id="vp-peca-{{ peca.id }}" data-titulo="{{ peca.nome_generico }}" data-subtitulo="{{ peca.marca.nome }}" title="Ampliar a foto"{% endif %}>
        {% if peca.imagem %}
            <img src="{{ peca.imagem.url }}" alt="{{ peca.nome_generico }}" loading="lazy">
            <span class="vp-card-foto-lupa" aria-hidden="true"><i class="fas fa-search-plus"></i></span>
        {% else %}
            <i class="fas fa-puzzle-piece"></i>
        {% endif %}
    </div>

    <div class="vp-card-info">
        <p class="vp-card-nome" title="{{ peca.nome_generico }}">{{ peca.nome_generico }}</p>
        <div class="vp-card-legendas">
            <p>{{ peca.marca.nome }}{% if peca.marca.grupo_fornecedor %} · {{ peca.marca.grupo_fornecedor.nome }}{% endif %}</p>
            {% if peca.codigo_fabricante %}<p>Cód.: {{ peca.codigo_fabricante }}</p>{% endif %}
            {% if peca.tambem_em_texto %}<p class="vp-card-tambem" title="Também vinculada a: {{ peca.tambem_em_texto }}"><i class="fas fa-link"></i> também em {{ peca.tambem_em_texto }}</p>{% endif %}
        </div>
    </div>

    <div class="vp-card-qtd-wrap">
        <label>Qtd. esperada</label>
        <input type="number" name="quantidade_{{ peca.id }}" class="vp-card-qtd-input" min="1" value="{{ peca.quantidade_vinculada }}" inputmode="numeric">
    </div>
</label>
